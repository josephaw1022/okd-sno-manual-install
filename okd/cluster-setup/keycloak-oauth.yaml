apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
    - name: keycloak
      mappingMethod: add
      type: OpenID
      openID:
        clientID: "okd"
        clientSecret:
          name: "keycloak-client-okd-secret"
        issuer: "https://keycloak.homelab.kubesoar.com/realms/homelab"
        claims:
          preferredUsername:
            - preferred_username
            - email
          name:
            - name
          email:
            - email
        extraScopes:
          - openid
          - profile
          - email
