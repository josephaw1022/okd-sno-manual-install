---
# Ansible playbook to create Valkey cache Quadlet container for Quay on desktop-server
# Usage: ansible-playbook -i inventory.yml create-quay-valkey.yml

- name: Create Valkey cache Quadlet container for Quay
  hosts: libvirt_hosts
  gather_facts: false
  vars:
    valkey_container_name: quay-valkey
    valkey_ip: 192.168.1.31
    valkey_port: 6379
    valkey_volume_name: quay-valkey-data
    lb_gateway: 192.168.1.1
    lb_subnet: 192.168.1.0/24
    macvlan_network_name: okd-lb-net
    dns_server: 192.168.1.5
    quadlet_dir: /etc/containers/systemd

  tasks:
    - name: Find LAN interface for 192.168.1.x
      ansible.builtin.shell:
        cmd: |
          ip -o -4 addr show | awk '/192\.168\.1\./ && $2 !~ /^macvlan/ {sub(/@.*/, "", $2); print $2; exit}'
      register: lan_interface
      changed_when: false

    - name: Set macvlan parent interface
      ansible.builtin.set_fact:
        macvlan_interface: "{{ lan_interface.stdout | default('eno1', true) }}"

    - name: Check if macvlan network exists
      ansible.builtin.command:
        cmd: sudo podman network exists {{ macvlan_network_name }}
      register: network_exists
      changed_when: false
      failed_when: false

    - name: Create macvlan network
      ansible.builtin.command:
        cmd: >
          sudo podman network create
          --driver macvlan
          --opt parent={{ macvlan_interface }}
          --subnet {{ lb_subnet }}
          --gateway {{ lb_gateway }}
          {{ macvlan_network_name }}
      when: network_exists.rc != 0

    - name: Ensure Quadlet systemd directory exists
      ansible.builtin.file:
        path: "{{ quadlet_dir }}"
        state: directory
        mode: '0755'

    - name: Check if standalone unmanaged container exists
      ansible.builtin.command:
        cmd: sudo podman container exists {{ valkey_container_name }}
      register: container_exists
      changed_when: false
      failed_when: false

    - name: Check if systemd unit is active
      ansible.builtin.command:
        cmd: systemctl is-active {{ valkey_container_name }}
      register: unit_active
      changed_when: false
      failed_when: false

    - name: Stop and remove standalone unmanaged container
      ansible.builtin.command:
        cmd: sudo podman rm -f {{ valkey_container_name }}
      when: container_exists.rc == 0 and unit_active.rc != 0

    - name: Deploy Valkey Quadlet volume file
      ansible.builtin.template:
        src: templates/quay/quay-valkey-data.volume.j2
        dest: "{{ quadlet_dir }}/{{ valkey_volume_name }}.volume"
        mode: '0644'
      notify: Restart Quay Valkey

    - name: Deploy Valkey Quadlet container file
      ansible.builtin.template:
        src: templates/quay/quay-valkey.container.j2
        dest: "{{ quadlet_dir }}/{{ valkey_container_name }}.container"
        mode: '0644'
      notify: Restart Quay Valkey

    - name: Flush handlers if quadlet files were updated
      ansible.builtin.meta: flush_handlers

    - name: Enable and start Quay Valkey systemd service
      ansible.builtin.systemd:
        name: "{{ valkey_container_name }}"
        daemon_reload: true
        enabled: true
        state: started

    - name: Wait for container to be running
      ansible.builtin.command:
        cmd: sudo podman inspect --format '{{ '{{' }}.State.Running{{ '}}' }}' {{ valkey_container_name }}
      register: container_running
      until: container_running.stdout == 'true'
      retries: 20
      delay: 2
      changed_when: false

    - name: Wait for Valkey to respond to ping
      ansible.builtin.command:
        cmd: sudo podman exec {{ valkey_container_name }} valkey-cli ping
      register: valkey_ping
      until: valkey_ping.stdout == 'PONG'
      retries: 20
      delay: 2
      changed_when: false

    - name: Display Valkey status
      ansible.builtin.debug:
        msg:
          - "Quay Valkey Quadlet service is ready!"
          - "Service: {{ valkey_container_name }}.service"
          - "Container: {{ valkey_container_name }}"
          - "IP Address: {{ valkey_ip }}"
          - "Domain: quay-valkey.kubesoar.com"
          - "Port: {{ valkey_port }}"
          - "Volume: {{ valkey_volume_name }}"

  handlers:
    - name: Restart Quay Valkey
      ansible.builtin.systemd:
        name: "{{ valkey_container_name }}"
        daemon_reload: true
        state: restarted
