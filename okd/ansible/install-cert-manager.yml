---
# Ansible playbook to install cert-manager via Helm on OpenShift/OKD
# Usage: ansible-playbook -i inventory.yml install-cert-manager.yml

- name: Install cert-manager via Helm
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default(lookup('env', 'HOME') + '/.kube/config', true) }}"
  vars:
    cert_manager_namespace: "{{ lookup('env', 'CERT_MANAGER_NAMESPACE') | default('cert-manager', true) }}"
    cert_manager_repo_name: "{{ lookup('env', 'CERT_MANAGER_HELM_REPO_NAME') | default('jetstack', true) }}"
    cert_manager_repo_url: "{{ lookup('env', 'CERT_MANAGER_HELM_REPO_URL') | default('https://charts.jetstack.io', true) }}"
    cert_manager_release_name: "{{ lookup('env', 'CERT_MANAGER_HELM_RELEASE') | default('cert-manager', true) }}"
    cert_manager_chart_version: "{{ lookup('env', 'CERT_MANAGER_CHART_VERSION') | default('v1.17.1', true) }}"

  tasks:
    - name: Verify Helm is installed
      ansible.builtin.command:
        cmd: helm version --short
      changed_when: false

    - name: Check if connected to OpenShift
      kubernetes.core.k8s_info:
        kind: Namespace
        name: openshift-marketplace
      register: oc_check
      failed_when: false

    - name: Fail if not connected to OpenShift
      ansible.builtin.fail:
        msg: |
          Not connected to OpenShift cluster.
          Run 'oc login' first or ensure KUBECONFIG is set.
      when: oc_check.resources is not defined or oc_check.resources | length == 0

    - name: Ensure cert-manager namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ cert_manager_namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: privileged
              pod-security.kubernetes.io/audit: privileged
              pod-security.kubernetes.io/warn: privileged

    - name: Ensure jetstack Helm repo is configured
      ansible.builtin.command:
        cmd: helm repo add {{ cert_manager_repo_name }} {{ cert_manager_repo_url }}
      register: cert_manager_repo_add
      changed_when: "'has been added' in cert_manager_repo_add.stdout"
      failed_when: false

    - name: Update jetstack Helm repo
      ansible.builtin.command:
        cmd: helm repo update {{ cert_manager_repo_name }}
      changed_when: false

    - name: Build Helm command for cert-manager install
      ansible.builtin.set_fact:
        cert_manager_helm_cmd: >-
          helm upgrade --install {{ cert_manager_release_name }} {{ cert_manager_repo_name }}/cert-manager
          --namespace {{ cert_manager_namespace }}
          --create-namespace
          --set crds.enabled=true
          --wait
          --timeout 10m
          {{ ('--version ' ~ cert_manager_chart_version) if (cert_manager_chart_version | length > 0) else '' }}

    - name: Install or upgrade cert-manager Helm release
      ansible.builtin.command:
        cmd: "{{ cert_manager_helm_cmd }}"
      register: cert_manager_install
      changed_when: "'STATUS: deployed' in cert_manager_install.stdout or 'STATUS: pending-upgrade' in cert_manager_install.stdout"

    - name: Wait for cert-manager controller deployment
      ansible.builtin.command:
        cmd: oc rollout status deployment/{{ cert_manager_release_name }} -n {{ cert_manager_namespace }} --timeout=300s
      changed_when: false

    - name: Wait for cert-manager-cainjector deployment
      ansible.builtin.command:
        cmd: oc rollout status deployment/{{ cert_manager_release_name }}-cainjector -n {{ cert_manager_namespace }} --timeout=300s
      changed_when: false

    - name: Wait for cert-manager-webhook deployment
      ansible.builtin.command:
        cmd: oc rollout status deployment/{{ cert_manager_release_name }}-webhook -n {{ cert_manager_namespace }} --timeout=300s
      changed_when: false

    - name: Wait for cert-manager Certificate CRD
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: certificates.cert-manager.io
      register: cert_manager_certificate_crd
      until: cert_manager_certificate_crd.resources | length > 0
      retries: 60
      delay: 5

    - name: Wait for cert-manager Issuer CRD
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: issuers.cert-manager.io
      register: cert_manager_issuer_crd
      until: cert_manager_issuer_crd.resources | length > 0
      retries: 60
      delay: 5

    - name: Wait for cert-manager ClusterIssuer CRD
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: clusterissuers.cert-manager.io
      register: cert_manager_cluster_issuer_crd
      until: cert_manager_cluster_issuer_crd.resources | length > 0
      retries: 60
      delay: 5

    - name: Display cert-manager installation status
      ansible.builtin.debug:
        msg:
          - "✅ cert-manager Helm release installed successfully!"
          - ""
          - "📋 Release: {{ cert_manager_release_name }}"
          - "📋 Namespace: {{ cert_manager_namespace }}"
          - "📋 Chart Version: {{ cert_manager_chart_version }}"
