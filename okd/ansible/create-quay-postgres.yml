---
# Ansible playbook to create PostgreSQL Quadlet container for Quay on desktop-server
# Usage: ansible-playbook -i inventory.yml create-quay-postgres.yml

- name: Create PostgreSQL Quadlet container for Quay
  hosts: libvirt_hosts
  gather_facts: false
  vars:
    pg_container_name: quay-postgres
    pg_ip: 192.168.1.30
    pg_port: 5432
    pg_volume_name: quay-postgres-data
    pg_database: "{{ quay_postgres_db | default('quay') }}"
    pg_user: "{{ quay_postgres_user | default('quay') }}"
    pg_password: "{{ quay_postgres_password | default('quaypass') }}"
    lb_gateway: 192.168.1.1
    lb_subnet: 192.168.1.0/24
    macvlan_network_name: okd-lb-net
    dns_server: 192.168.1.5
    pg_init_dir: /opt/quay-postgres/initdb.d
    quadlet_dir: /etc/containers/systemd

  tasks:
    - name: Find LAN interface for 192.168.1.x
      ansible.builtin.shell:
        cmd: |
          ip -o -4 addr show | awk '/192\.168\.1\./ && $2 !~ /^macvlan/ {sub(/@.*/, "", $2); print $2; exit}'
      register: lan_interface
      changed_when: false

    - name: Set macvlan parent interface
      ansible.builtin.set_fact:
        macvlan_interface: "{{ lan_interface.stdout | default('eno1', true) }}"

    - name: Check if macvlan network exists
      ansible.builtin.command:
        cmd: sudo podman network exists {{ macvlan_network_name }}
      register: network_exists
      changed_when: false
      failed_when: false

    - name: Create macvlan network
      ansible.builtin.command:
        cmd: >
          sudo podman network create
          --driver macvlan
          --opt parent={{ macvlan_interface }}
          --subnet {{ lb_subnet }}
          --gateway {{ lb_gateway }}
          {{ macvlan_network_name }}
      when: network_exists.rc != 0

    - name: Ensure PostgreSQL init directory exists
      ansible.builtin.file:
        path: "{{ pg_init_dir }}"
        state: directory
        mode: '0755'

    - name: Deploy pg_trgm extension script for Quay
      ansible.builtin.copy:
        dest: "{{ pg_init_dir }}/init-quay-db.sql"
        mode: '0644'
        content: |
          -- Quay requires pg_trgm extension
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    - name: Ensure Quadlet systemd directory exists
      ansible.builtin.file:
        path: "{{ quadlet_dir }}"
        state: directory
        mode: '0755'

    - name: Check if standalone unmanaged container exists
      ansible.builtin.command:
        cmd: sudo podman container exists {{ pg_container_name }}
      register: container_exists
      changed_when: false
      failed_when: false

    - name: Check if systemd unit is active
      ansible.builtin.command:
        cmd: systemctl is-active {{ pg_container_name }}
      register: unit_active
      changed_when: false
      failed_when: false

    - name: Stop and remove standalone unmanaged container
      ansible.builtin.command:
        cmd: sudo podman rm -f {{ pg_container_name }}
      when: container_exists.rc == 0 and unit_active.rc != 0

    - name: Deploy PostgreSQL Quadlet volume file
      ansible.builtin.template:
        src: templates/quay/quay-postgres-data.volume.j2
        dest: "{{ quadlet_dir }}/{{ pg_volume_name }}.volume"
        mode: '0644'
      notify: Restart Quay PostgreSQL

    - name: Deploy PostgreSQL Quadlet container file
      ansible.builtin.template:
        src: templates/quay/quay-postgres.container.j2
        dest: "{{ quadlet_dir }}/{{ pg_container_name }}.container"
        mode: '0644'
      notify: Restart Quay PostgreSQL

    - name: Flush handlers if quadlet files were updated
      ansible.builtin.meta: flush_handlers

    - name: Enable and start Quay PostgreSQL systemd service
      ansible.builtin.systemd:
        name: "{{ pg_container_name }}"
        daemon_reload: true
        enabled: true
        state: started

    - name: Wait for container to be running
      ansible.builtin.command:
        cmd: sudo podman inspect --format '{{ '{{' }}.State.Running{{ '}}' }}' {{ pg_container_name }}
      register: container_running
      until: container_running.stdout == 'true'
      retries: 20
      delay: 2
      changed_when: false

    - name: Wait for PostgreSQL to be ready
      ansible.builtin.command:
        cmd: sudo podman exec {{ pg_container_name }} pg_isready -U {{ pg_user }} -d {{ pg_database }}
      register: pg_ready
      until: pg_ready.rc == 0
      retries: 60
      delay: 5
      changed_when: false

    - name: Ensure pg_trgm extension exists in database
      ansible.builtin.command:
        cmd: sudo podman exec {{ pg_container_name }} psql -U {{ pg_user }} -d {{ pg_database }} -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      register: ext_result
      changed_when: false

    - name: Ensure clair database exists on PostgreSQL
      ansible.builtin.command:
        cmd: sudo podman exec {{ pg_container_name }} psql -U {{ pg_user }} -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'clair'"
      register: clair_db_check
      changed_when: false

    - name: Create clair database if not exists
      ansible.builtin.command:
        cmd: sudo podman exec {{ pg_container_name }} psql -U {{ pg_user }} -d postgres -c "CREATE DATABASE clair;"
      when: clair_db_check.stdout | trim == ""
      changed_when: true

    - name: Ensure uuid-ossp and pgcrypto extensions exist in clair database
      ansible.builtin.command:
        cmd: sudo podman exec {{ pg_container_name }} psql -U {{ pg_user }} -d clair -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"; CREATE EXTENSION IF NOT EXISTS pgcrypto;'
      changed_when: false

    - name: Display PostgreSQL status
      ansible.builtin.debug:
        msg:
          - "Quay PostgreSQL Quadlet service is ready!"
          - "Service: {{ pg_container_name }}.service"
          - "Container: {{ pg_container_name }}"
          - "IP Address: {{ pg_ip }}"
          - "Domain: quay-postgres.kubesoar.com"
          - "Port: {{ pg_port }}"
          - "Database: {{ pg_database }}"
          - "User: {{ pg_user }}"
          - "Volume: {{ pg_volume_name }}"

  handlers:
    - name: Restart Quay PostgreSQL
      ansible.builtin.systemd:
        name: "{{ pg_container_name }}"
        daemon_reload: true
        state: restarted
