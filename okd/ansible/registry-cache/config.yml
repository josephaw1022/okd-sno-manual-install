version: 0.1
log:
  level: info
  fields:
    service: registry
storage:
  cache:
    blobdescriptor: inmemory
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true
  maintenance:
    uploadpurging:
      enabled: true
      age: 168h
      interval: 24h
      dryrun: false
http:
  addr: :5000
  headers:
    X-Content-Type-Options: [nosniff]
proxy:
  remoteurl: https://quay.io
  # Uncomment and add credentials if pulling from private quay.io repos
  # username: your-quay-username
  # password: your-quay-password
health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
