---
# Configure Macvlan Shim on laptop-server for Host & Subnet Router to Container/VM Communication
# Usage: ansible-playbook -i inventory.yml configure-macvlan-shim-laptop.yml

- name: Configure Macvlan Shim on laptop-server
  hosts: laptop_libvirt_hosts
  become: true
  vars:
    shim_interface_name: macvlan-shim
    shim_ip: "192.168.1.250/24"
    target_ips:
      - "192.168.1.5"   # Pi-hole DNS VM
      - "192.168.1.30"  # Quay PostgreSQL
      - "192.168.1.31"  # Quay Valkey
      - "192.168.1.32"  # Quay Registry
      - "192.168.1.33"  # Quay Nginx Ingress
      - "192.168.1.34"  # Quay Clair Scanner

  tasks:
    - name: Find LAN parent interface for 192.168.1.x
      ansible.builtin.shell:
        cmd: |
          ip -o -4 addr show | awk '/192.168.1./ {print $2; exit}'
      register: lan_interface
      changed_when: false

    - name: Set parent interface fact
      ansible.builtin.set_fact:
        parent_interface: "{{ lan_interface.stdout | default('enp0s25', true) }}"

    - name: Deploy macvlan-shim systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/macvlan-shim.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Macvlan Shim for Host and Subnet Router to Macvlan Container/VM Communication
          After=network.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=-/sbin/ip link add {{ shim_interface_name }} link {{ parent_interface }} type macvlan mode bridge
          ExecStart=-/sbin/ip addr add {{ shim_ip }} dev {{ shim_interface_name }}
          ExecStart=/sbin/ip link set {{ shim_interface_name }} up
          {% for ip in target_ips %}
          ExecStart=/sbin/ip route replace {{ ip }}/32 dev {{ shim_interface_name }}
          {% endfor %}
          ExecStop=/sbin/ip link del {{ shim_interface_name }}

          [Install]
          WantedBy=multi-user.target
      register: service_file

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      when: service_file.changed

    - name: Enable and restart macvlan-shim service
      ansible.builtin.systemd:
        name: macvlan-shim
        enabled: true
        state: restarted

    - name: Verify connectivity to Pi-hole and Quay Nginx via shim
      ansible.builtin.command:
        cmd: "ping -c 2 -W 2 {{ item }}"
      loop:
        - "192.168.1.5"
        - "192.168.1.33"
      register: ping_test
      changed_when: false

    - name: Display Macvlan Shim status
      ansible.builtin.debug:
        msg:
          - "Macvlan shim service configured and active on {{ inventory_hostname }}!"
          - "Shim Interface: {{ shim_interface_name }} -> {{ parent_interface }}"
          - "Shim IP: {{ shim_ip }}"
          - "Connected target IPs: {{ target_ips | join(', ') }}"
