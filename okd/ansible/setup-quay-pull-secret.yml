---
# Ansible playbook to configure Quay registry credentials in the OKD global pull secret
# Usage: ansible-playbook -i inventory.yml setup-quay-pull-secret.yml

- name: Setup Quay registry credentials in OKD global pull secret
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    base_domain: "{{ lookup('env', 'BASE_DOMAIN') | default('kubesoar.com', true) }}"
    quay_registry: "quay.{{ base_domain }}"
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default(lookup('env', 'HOME') + '/.kube/config', true) }}"

  tasks:
    - name: Ensure quay credentials are provided
      ansible.builtin.assert:
        that:
          - quay_username is defined
          - quay_username | length > 0
          - quay_password is defined
          - quay_password | length > 0
        fail_msg: "quay_username and quay_password must be defined in group_vars/all.yml"

    - name: Check OpenShift connectivity
      kubernetes.core.k8s_info:
        kind: Namespace
        name: openshift-config
      register: ns_check
      failed_when: false

    - name: Fail if not connected to OpenShift
      ansible.builtin.fail:
        msg: "Not connected to OpenShift cluster. Run 'oc login' or check your kubeconfig."
      when: ns_check.resources is not defined or ns_check.resources | length == 0

    - name: Get current global pull-secret
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: openshift-config
        name: pull-secret
      register: pull_secret_res

    - name: Parse existing docker config JSON
      ansible.builtin.set_fact:
        current_docker_config: >-
          {{
            (pull_secret_res.resources[0].data['.dockerconfigjson'] | b64decode | from_json)
            if (pull_secret_res.resources | length > 0 and pull_secret_res.resources[0].data is defined and '.dockerconfigjson' in pull_secret_res.resources[0].data)
            else {'auths': {}}
          }}

    - name: Compute base64 auth for Quay
      ansible.builtin.set_fact:
        quay_auth_b64: "{{ (quay_username ~ ':' ~ quay_password) | b64encode }}"

    - name: Build updated docker config dictionary
      ansible.builtin.set_fact:
        updated_docker_config: >-
          {{
            current_docker_config | combine({
              'auths': current_docker_config.auths | default({}) | combine({
                quay_registry: {
                  'auth': quay_auth_b64
                }
              })
            }, recursive=True)
          }}

    - name: Apply updated pull-secret to openshift-config
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: pull-secret
            namespace: openshift-config
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: "{{ updated_docker_config | to_json | b64encode }}"

    - name: Notify update
      ansible.builtin.debug:
        msg: >-
          ✅ Successfully updated OKD global pull-secret with credentials for {{ quay_registry }} (user: {{ quay_username }}).
          MachineConfigOperator will synchronize credentials to /var/lib/kubelet/config.json across all cluster nodes.
