---
# Ansible playbook to install Istio CNI in ambient profile via Helm
# Usage: ansible-playbook -i inventory.yml install-istio-cni.yml

- name: Install Istio CNI ambient profile
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default(lookup('env', 'HOME') + '/.kube/config', true) }}"
  vars:
    istio_namespace: "{{ lookup('env', 'ISTIO_NAMESPACE') | default('istio-system', true) }}"
    istio_repo_name: "{{ lookup('env', 'ISTIO_HELM_REPO_NAME') | default('istio', true) }}"
    istio_repo_url: "{{ lookup('env', 'ISTIO_HELM_REPO_URL') | default('https://istio-release.storage.googleapis.com/charts', true) }}"
    istio_cni_release: "{{ lookup('env', 'ISTIO_CNI_RELEASE') | default('istio-cni', true) }}"
    istio_chart_version: "{{ lookup('env', 'ISTIO_CHART_VERSION') | default('', true) }}"
    istio_global_platform: "{{ lookup('env', 'ISTIO_GLOBAL_PLATFORM') | default('openshift', true) }}"

  tasks:
    - name: Verify Helm is installed
      ansible.builtin.command:
        cmd: helm version --short
      changed_when: false

    - name: Check if connected to OpenShift
      kubernetes.core.k8s_info:
        kind: Namespace
        name: openshift-marketplace
      register: oc_check
      failed_when: false

    - name: Fail if not connected to OpenShift
      ansible.builtin.fail:
        msg: |
          Not connected to OpenShift cluster.
          Run 'oc login' first or ensure KUBECONFIG is set.
      when: oc_check.resources is not defined or oc_check.resources | length == 0

    - name: Ensure Istio Helm repo is configured
      ansible.builtin.command:
        cmd: helm repo add {{ istio_repo_name }} {{ istio_repo_url }}
      register: istio_repo_add
      changed_when: "'has been added' in istio_repo_add.stdout"
      failed_when: false

    - name: Update Istio Helm repo
      ansible.builtin.command:
        cmd: helm repo update {{ istio_repo_name }}
      changed_when: false

    - name: Ensure Istio namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ istio_namespace }}"

    - name: Ensure Istio CNI SCC cluster role binding exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: istio-cni-scc-privileged
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: system:openshift:scc:privileged
          subjects:
            - kind: ServiceAccount
              name: istio-cni
              namespace: "{{ istio_namespace }}"

    - name: Build Helm command for Istio CNI ambient install
      ansible.builtin.set_fact:
        istio_cni_helm_cmd: >-
          helm upgrade --install {{ istio_cni_release }} {{ istio_repo_name }}/cni
          --namespace {{ istio_namespace }}
          --create-namespace
          --set profile=ambient
          --set global.platform={{ istio_global_platform }}
          --wait
          --timeout 10m
          {{ ('--version ' ~ istio_chart_version) if (istio_chart_version | length > 0) else '' }}

    - name: Install or upgrade Istio CNI release
      ansible.builtin.command:
        cmd: "{{ istio_cni_helm_cmd }}"
      register: istio_cni_install
      changed_when: "'STATUS: deployed' in istio_cni_install.stdout or 'STATUS: pending-upgrade' in istio_cni_install.stdout"

    - name: Wait for Istio CNI daemonset to be ready
      ansible.builtin.command:
        cmd: oc rollout status daemonset/istio-cni-node -n {{ istio_namespace }} --timeout=300s
      changed_when: false

    - name: Display Istio CNI install status
      ansible.builtin.debug:
        msg:
          - "✅ Istio CNI installed with ambient profile."
          - "Release: {{ istio_cni_release }}"
          - "Namespace: {{ istio_namespace }}"
