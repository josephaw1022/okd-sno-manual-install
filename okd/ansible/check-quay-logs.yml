---
- name: Check Quay registry and Nginx logs on desktop-server
  hosts: libvirt_hosts
  gather_facts: false
  tasks:
    - name: Get Quay logs
      ansible.builtin.command:
        cmd: sudo podman logs --tail 50 quay-registry
      register: quay_logs
      changed_when: false

    - name: Display Quay logs
      ansible.builtin.debug:
        var: quay_logs.stdout_lines

    - name: Get Nginx logs
      ansible.builtin.command:
        cmd: sudo podman logs --tail 50 quay-nginx
      register: nginx_logs
      changed_when: false
      failed_when: false

    - name: Display Nginx logs
      ansible.builtin.debug:
        var: nginx_logs.stdout_lines










